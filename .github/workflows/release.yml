name: Publish SDK

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: sdk-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            +refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::SDK release tag must point to a commit reachable from origin/main"
            exit 1
          }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Require tag and package version to match
        run: node scripts/check-release-tag.mjs "${GITHUB_REF_NAME}"
      - name: Verify exact generated release
        run: pnpm verify
      - name: Pack immutable release candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/wathba-sdk-candidate"
          mkdir -p "$candidate_dir"
          pack_json="$(pnpm pack --json --pack-destination "$candidate_dir")"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          candidate_path="$(
            jq -er --arg name "$package_name" --arg version "$package_version" \
              'select(.name == $name and .version == $version) | .filename' \
              <<<"$pack_json"
          )"
          test -f "$candidate_path"
          case "$candidate_path" in
            "$candidate_dir"/*) ;;
            *)
              echo "::error::packed candidate escaped the runner staging directory"
              exit 1
              ;;
          esac
          mv "$candidate_path" "$candidate_dir/candidate.tgz"
          (
            cd "$candidate_dir"
            sha512sum candidate.tgz > candidate.sha512
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-release-candidate
          path: |
            ${{ runner.temp }}/wathba-sdk-candidate/candidate.tgz
            ${{ runner.temp }}/wathba-sdk-candidate/candidate.sha512
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require the supported npm trusted-publishing client
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e '
            const actual = process.argv[1].split(".").map(Number);
            const required = [11, 5, 1];
            const comparison = required.reduce(
              (result, part, index) => result || Math.sign(actual[index] - part),
              0,
            );
            if (actual.length < required.length || actual.some(Number.isNaN) || comparison < 0) {
              throw new Error(`npm 11.5.1 or later is required; received ${process.argv[1]}`);
            }
          ' "$npm_version"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-release-candidate
          path: ${{ runner.temp }}/wathba-sdk-candidate
      - name: Validate the downloaded release candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/wathba-sdk-candidate"
          candidate_path="${candidate_dir}/candidate.tgz"
          checksum_path="${candidate_dir}/candidate.sha512"
          expected_version="${GITHUB_REF_NAME#v}"
          test -f "$candidate_path"
          test ! -L "$candidate_path"
          test -f "$checksum_path"
          test ! -L "$checksum_path"
          [[ "$(cat "$checksum_path")" =~ ^[0-9a-f]{128}[[:space:]][[:space:]]candidate\.tgz$ ]] || {
            echo "::error::candidate checksum manifest is invalid"
            exit 1
          }
          (
            cd "$candidate_dir"
            sha512sum --check --strict candidate.sha512
          )
          manifest_path="${RUNNER_TEMP}/wathba-sdk-candidate-package.json"
          manifest_count="$(tar -tzf "$candidate_path" | awk '$0 == "package/package.json" { count += 1 } END { print count + 0 }')"
          test "$manifest_count" = "1"
          tar -xOf "$candidate_path" package/package.json > "$manifest_path"
          node - "$manifest_path" "$expected_version" <<'NODE'
          const { readFileSync } = require('node:fs');
          const manifest = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (manifest.name !== '@wathba-cli/sdk' || manifest.version !== process.argv[3]) {
            throw new Error('release_candidate_identity_invalid');
          }
          NODE
      - name: Detect an existing immutable registry version
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          package_name="@wathba-cli/sdk"
          package_version="${GITHUB_REF_NAME#v}"
          registry_path="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1])+'/'+encodeURIComponent(process.argv[2]))" "$package_name" "$package_version")"
          response="${RUNNER_TEMP}/wathba-sdk-registry-version.json"
          status="$(
            curl -sS -L --retry 3 --retry-all-errors --connect-timeout 10 \
              -o "$response" -w '%{http_code}' \
              "https://registry.npmjs.org/${registry_path}"
          )"
          case "$status" in
            200)
              jq -e --arg name "$package_name" --arg version "$package_version" \
                '.name == $name and .version == $version' "$response" >/dev/null
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::npm registry availability check failed closed with HTTP ${status}"
              exit 1
              ;;
          esac
      - name: Publish with npm provenance
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            +refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::SDK release tag is no longer reachable from current origin/main"
            exit 1
          }
          case "$GITHUB_REF_NAME" in
            *-dev.*) dist_tag=dev ;;
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish "${RUNNER_TEMP}/wathba-sdk-candidate/candidate.tgz" \
            --access public --provenance --tag "$dist_tag"

  attest:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require the supported npm provenance-auditing client
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e '
            const actual = process.argv[1].split(".").map(Number);
            const required = [11, 5, 1];
            const comparison = required.reduce(
              (result, part, index) => result || Math.sign(actual[index] - part),
              0,
            );
            if (actual.length < required.length || actual.some(Number.isNaN) || comparison < 0) {
              throw new Error(`npm 11.5.1 or later is required; received ${process.argv[1]}`);
            }
          ' "$npm_version"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-release-candidate
          path: ${{ runner.temp }}/wathba-sdk-candidate
      - name: Verify the candidate artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP}/wathba-sdk-candidate"
          [[ "$(cat "$candidate_dir/candidate.sha512")" =~ ^[0-9a-f]{128}[[:space:]][[:space:]]candidate\.tgz$ ]]
          (
            cd "$candidate_dir"
            sha512sum --check --strict candidate.sha512
          )
      - name: Retrieve and verify the published registry artifact
        run: node scripts/verify-published-package.mjs "${RUNNER_TEMP}/wathba-sdk-candidate/candidate.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-publication-attestation
          path: publication-attestation.json
          if-no-files-found: error
          retention-days: 90

  release:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-publication-attestation
          path: ${{ runner.temp }}/wathba-sdk-publication-attestation
      - name: Attach immutable publication evidence to the GitHub release
        id: release_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          attestation_path="${RUNNER_TEMP}/wathba-sdk-publication-attestation/publication-attestation.json"
          test -f "$attestation_path"
          test ! -L "$attestation_path"

          authorize_tag_on_main() {
            git fetch --force origin \
              +refs/heads/main:refs/remotes/origin/main --no-tags
            test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::SDK release tag is no longer reachable from current origin/main"
              exit 1
            }
          }

          evidence_state=created
          release_flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            authorize_tag_on_main
            gh release create "$GITHUB_REF_NAME" "$attestation_path" \
              "${release_flags[@]}"
          else
            asset_count="$(
              gh release view "$GITHUB_REF_NAME" --json assets \
                --jq '[.assets[] | select(.name == "publication-attestation.json")] | length'
            )"
            case "$asset_count" in
              0)
                authorize_tag_on_main
                gh release upload "$GITHUB_REF_NAME" "$attestation_path"
                ;;
              1)
                evidence_state=existing
                ;;
              *)
                echo "::error::GitHub release contains duplicate publication attestation assets"
                exit 1
                ;;
            esac
          fi

          asset_count="$(
            gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '[.assets[] | select(.name == "publication-attestation.json")] | length'
          )"
          test "$asset_count" = "1" || {
            echo "::error::GitHub release must contain exactly one publication attestation"
            exit 1
          }
          evidence_dir="${RUNNER_TEMP}/existing-sdk-publication-evidence"
          mkdir -p "$evidence_dir"
          gh release download "$GITHUB_REF_NAME" \
            --pattern publication-attestation.json --dir "$evidence_dir"
          echo "state=${evidence_state}" >> "$GITHUB_OUTPUT"
      - name: Validate the durable publication evidence without a write token
        env:
          EVIDENCE_STATE: ${{ steps.release_evidence.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          attestation_path="${RUNNER_TEMP}/wathba-sdk-publication-attestation/publication-attestation.json"
          existing_evidence="${RUNNER_TEMP}/existing-sdk-publication-evidence/publication-attestation.json"
          case "$EVIDENCE_STATE" in
            created)
              cmp "$attestation_path" "$existing_evidence"
              ;;
            existing)
              node scripts/verify-publication-attestation-asset.mjs \
                "$attestation_path" "$existing_evidence"
              ;;
            *)
              echo "::error::publication evidence state is invalid"
              exit 1
              ;;
          esac
